                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                </button>
                <button id="btn-modal-cancel" class="btn-icon danger edit-element" title="取消">

                </button>
                <button class="btn-icon close-modal-btn" title="關閉">

                </button>
            </div>
        </div>

        <div class="modal-body" style="overflow-y: auto;">
            <form id="product-detail-form" onsubmit="return false;">
                <div class="modal-grid-layout">
                    
                    <div class="section-block">
                        <div class="section-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            基本資料

                        <div class="modal-form-group">
                            <label>商品名稱 (Name)</label>
                            <input type="text" name="name" class="modal-form-control" required disabled>
                        </div>
                        
                        <div class="modal-form-group">
                            <label>分類 (Category)</label>
                            
                            <div id="view-category-display" class="view-category-tag view-element"></div>

                            <div class="edit-category-wrapper edit-element">
                                <div id="category-select-mode">
                                    <select name="category_select" class="modal-form-control" id="input-category-select">
                                        </select>
                                    <div style="margin-top:4px; text-align:right;">
                                        <button type="button" id="btn-to-manual" class="category-action-btn">＋ 手動輸入新分類</button>
                                    </div>
                                </div>

                                <div id="category-manual-mode" style="display:none;">
                                    <input type="text" name="category_text" id="input-category-text" class="modal-form-control" placeholder="請輸入新分類名稱">
                                    <div style="margin-top:4px; text-align:right;">
                                        <button type="button" id="btn-to-select" class="category-action-btn" style="color:var(--text-secondary);">↩ 取消，返回選單</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="modal-form-group">
                            <label>規格 (Spec)</label>
                            <input type="text" name="spec" class="modal-form-control" disabled>
                        </div>
                    </div>

                    <div class="section-card sensitive">
                        <div class="section-title">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                            成本與定價
                        </div>
                        
                        <div class="modal-form-group">
                            <label style="color:var(--accent-red);">成本 (Cost)</label>
                            <div class="input-wrapper">
                                <input type="text" id="input-cost-display" class="modal-form-control cost-input-original" value="******" readonly disabled>
                                
                                <input type="number" name="cost" id="input-cost-real" class="modal-form-control cost-input-original" style="display:none;" placeholder="輸入成本">
                            </div>
                            <small class="view-element" style="color:var(--accent-red); font-size:0.75rem; margin-top:4px; display:block;">* 機密資料，僅授權人員可編輯</small>
                        </div>

                        <div class="modal-form-group">
                            <label>MTB 報價</label>
                            <input type="number" name="priceMtb" class="modal-form-control" placeholder="-" disabled>
                        </div>

                        <div class="modal-form-group">
                            <label>SI 報價</label>
                            <input type="number" name="priceSi" class="modal-form-control" placeholder="-" disabled>
                        </div>

                        <div class="modal-form-group">
                            <label>MTU 報價</label>
                            <input type="number" name="priceMtu" class="modal-form-control" placeholder="-" disabled>
                        </div>

                    </div>

                    <div class="section-block full-width">
                        <div class="section-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

                        </div>
                        <div class="modal-form-group">
                            <textarea name="description" class="modal-form-control" rows="3" placeholder="無備註" disabled></textarea>
                        </div>
                    </div>
                    
                    <input type="hidden" name="id">
                </div>
            </form>
        </div>
    </div>
