<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機會詳情</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/modules/variables.css">
    <link rel="stylesheet" href="/styles/modules/components.css">
    <link rel="stylesheet" href="/styles/modals.css">

    <style>
        /* 【最終修正】強制確保 widget-content 及其內容可見 */
        #opp-potential-contacts-container.widget-content {
            display: block !important;
            flex-grow: initial !important;
            min-height: 50px; /* 給予一個最小高度以確保容器不會塌陷 */
        }

        /* 新增的子頁籤樣式 */
        .sub-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: var(--spacing-5);
        }
        .sub-tab-link {
            padding: var(--spacing-3) var(--spacing-4);
            cursor: pointer;
            color: var(--text-muted);
            border: none;
            background: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px; /* 讓 active 的 border 蓋過底線 */
            transition: all 0.2s ease;
            
            font-size: var(--font-size-base); /* 1rem */
            font-weight: 700; /* 加粗 */
        }
        
        .sub-tab-link.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            /* 使用 color-mix 產生 20% 透明度的 accent-blue */
            background-color: color-mix(in srgb, var(--accent-blue) 20%, transparent); 
            border-radius: var(--rounded-md) var(--rounded-md) 0 0; /* 頂部圓角 */
        }

        .sub-tab-link:hover {
            color: var(--text-primary);
            /* Hover 使用 15% 透明度，比 active 略淡 */
            background-color: color-mix(in srgb, var(--accent-blue) 15%, transparent); 
            border-radius: var(--rounded-md) var(--rounded-md) 0 0; /* 同樣追加圓角 */
            border-bottom-color: var(--border-color); /* 給 hover 一個底線 */
        }
        
        .sub-tab-content {
            display: none;
        }
        .sub-tab-content.active {
            display: block;
        }
        .opp-layout-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(210px, 21vw, 340px);
            gap: var(--spacing-6);
            align-items: start;
        }

        .opp-workspace-shell,
        .opp-workspace-header {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-5);
            width: 100%;
            min-width: 0;
        }

        .opp-main-info {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-5);
            min-width: 0;
        }

        .opp-timeline-zone,
        .opp-context-rail {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-6);
            width: 100%;
            min-width: 0;
        }

        .opp-timeline-zone {
            margin-top: var(--spacing-8);
        }

        .opp-context-rail > .dashboard-widget,
        #opportunity-stage-stepper-container,
        .opp-timeline-zone > .tab-content,
        #tab-content-interactions {
            border-radius: var(--rounded-sm);
        }

        #tab-content-interactions {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            box-shadow: none;
            padding: var(--spacing-3);
        }

        #opportunity-detail-container .opp-quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-2);
        }

        #opportunity-detail-container #opportunity-stage-stepper-container {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            box-shadow: none;
            padding: var(--spacing-4);
        }

        #opportunity-detail-container #opportunity-stage-stepper-container .widget-header {
            align-items: center;
            gap: var(--spacing-2);
            padding-bottom: var(--spacing-2);
            margin-bottom: var(--spacing-2) !important;
            border-bottom: 1px solid color-mix(in srgb, var(--border-color) 55%, transparent);
        }

        #opportunity-detail-container #opportunity-stage-stepper-container .widget-title {
            font-size: var(--font-size-xs);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.32px;
            line-height: 1.2;
        }

        #opportunity-detail-container #opportunity-stage-stepper-container #edit-stepper-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            box-shadow: none;
            padding: 5px 8px;
            transform: none;
        }

        #opportunity-detail-container #opportunity-stage-stepper-container #edit-stepper-btn:hover {
            background: color-mix(in srgb, var(--border-color) 28%, transparent);
            border-color: color-mix(in srgb, var(--border-color) 64%, transparent);
            color: var(--text-secondary);
            box-shadow: none;
            transform: none;
        }

        #opportunity-detail-container #opportunity-stage-stepper {
            padding: 0;
            min-width: 0;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-stepper-container {
            --pipeline-step-height: clamp(38px, 3.1vw, 42px);
            --pipeline-step-min: clamp(96px, 9vw, 136px);
            --pipeline-step-name-size: clamp(0.625rem, 0.61rem + 0.16vw, 0.70rem);
            --pipeline-step-pad-start: clamp(8px, 0.9vw, 10px);
            --pipeline-step-pad-end: clamp(12px, 1.4vw, 18px);
            --pipeline-cut: 12px;
            display: flex;
            align-items: stretch;
            gap: 4px;
            padding: 0;
            margin-top: var(--spacing-3);
            background: transparent;
            border: 0;
            border-radius: 0;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            scrollbar-width: none;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-stepper-container::-webkit-scrollbar {
            display: none;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step {
            flex: 1 1 0;
            min-width: var(--pipeline-step-min);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: var(--spacing-2);
            min-height: var(--pipeline-step-height);
            text-align: left;
            position: relative;
            padding: 7px var(--pipeline-step-pad-end) 7px var(--pipeline-step-pad-start);
            background: transparent;
            border: 0;
            border-radius: 0;
            clip-path: none;
            isolation: isolate;
            z-index: 1;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step::before,
        #opportunity-detail-container #opportunity-stage-stepper .stage-step::after {
            content: '';
            position: absolute;
            clip-path: polygon(0 0, calc(100% - var(--pipeline-cut)) 0, 100% 50%, calc(100% - var(--pipeline-cut)) 100%, 0 100%);
            pointer-events: none;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step::before {
            inset: 0;
            background: color-mix(in srgb, var(--border-color) 78%, var(--text-muted));
            z-index: -2;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step::after {
            inset: 1px;
            background: color-mix(in srgb, var(--primary-bg) 84%, var(--secondary-bg));
            z-index: -1;
        }

        #opportunity-detail-container #opportunity-stage-stepper .step-circle {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border-radius: var(--rounded-sm);
            border: 1px solid color-mix(in srgb, var(--border-color) 62%, var(--text-muted));
            background: color-mix(in srgb, var(--secondary-bg) 84%, var(--primary-bg));
            color: var(--text-secondary);
            font-size: var(--font-size-xs);
            font-weight: 650;
            line-height: 1;
            position: relative;
            z-index: 1;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        #opportunity-detail-container #opportunity-stage-stepper .step-name {
            min-width: 0;
            max-width: 100%;
            margin-top: 0;
            color: var(--text-secondary);
            font-size: var(--pipeline-step-name-size);
            font-weight: 600;
            line-height: 1.35;
            position: relative;
            z-index: 1;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.completed {
            background: transparent;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.completed::before {
            background: color-mix(in srgb, var(--accent-blue) 36%, var(--border-color));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.completed::after {
            background: color-mix(in srgb, var(--accent-blue) 12%, var(--secondary-bg));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.completed .step-circle {
            background: color-mix(in srgb, var(--accent-blue) 18%, var(--secondary-bg));
            border-color: color-mix(in srgb, var(--accent-blue) 48%, var(--border-color));
            color: color-mix(in srgb, var(--accent-blue) 76%, var(--text-primary));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.completed .step-name {
            color: var(--text-secondary);
            font-weight: 600;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.current {
            background: transparent;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.current::before {
            background: color-mix(in srgb, var(--accent-blue) 64%, var(--border-color));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.current::after {
            background: color-mix(in srgb, var(--accent-blue) 68%, var(--text-primary));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.current .step-circle {
            background: color-mix(in srgb, var(--secondary-bg) 94%, var(--accent-blue));
            border-color: color-mix(in srgb, var(--secondary-bg) 70%, var(--accent-blue));
            color: color-mix(in srgb, var(--accent-blue) 82%, var(--text-primary));
            transform: none;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.current .step-name {
            color: var(--secondary-bg);
            font-weight: 700;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.pending {
            background: transparent;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.pending::before {
            background: color-mix(in srgb, var(--border-color) 54%, transparent);
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.pending::after {
            background: color-mix(in srgb, var(--primary-bg) 94%, var(--secondary-bg));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.pending .step-circle {
            background: color-mix(in srgb, var(--primary-bg) 82%, var(--secondary-bg));
            border-color: color-mix(in srgb, var(--border-color) 54%, transparent);
            color: color-mix(in srgb, var(--text-muted) 86%, var(--text-secondary));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.pending .step-name {
            color: color-mix(in srgb, var(--text-muted) 88%, var(--border-color));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.skipped {
            background: transparent;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.skipped::before {
            background: color-mix(in srgb, var(--accent-red) 32%, var(--border-color));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.skipped::after {
            background: color-mix(in srgb, var(--accent-red) 8%, var(--secondary-bg));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-step.skipped .step-circle {
            background: color-mix(in srgb, var(--accent-red) 14%, var(--secondary-bg));
            border-color: color-mix(in srgb, var(--accent-red) 40%, var(--border-color));
            color: color-mix(in srgb, var(--accent-red) 74%, var(--text-primary));
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-stepper-container.edit-mode .step-circle:hover {
            border-color: var(--accent-blue);
            transform: none;
            box-shadow: none;
        }

        #opportunity-detail-container #opportunity-stage-stepper .stage-stepper-container.edit-mode .step-name:hover {
            background-color: color-mix(in srgb, var(--accent-blue) 9%, transparent);
        }

        @media (max-width: 768px) {
            #opportunity-detail-container #opportunity-stage-stepper .stage-stepper-container {
                flex-wrap: wrap;
                gap: var(--spacing-2);
                overflow-x: visible;
            }

            #opportunity-detail-container #opportunity-stage-stepper .stage-step {
                flex-basis: 25%;
                min-width: 120px;
                padding-right: 10px;
                border-radius: var(--rounded-sm);
            }

            #opportunity-detail-container #opportunity-stage-stepper .stage-step::before,
            #opportunity-detail-container #opportunity-stage-stepper .stage-step::after {
                clip-path: inset(0 round var(--rounded-sm));
            }
        }

        #opportunity-detail-container .opp-context-rail {
            gap: var(--spacing-4);
        }

        #opportunity-detail-container .opp-context-rail > .dashboard-widget {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--rounded-sm);
            box-shadow: none;
            padding: var(--spacing-3);
        }

        #opportunity-detail-container .opp-context-rail .widget-header {
            gap: var(--spacing-2);
            padding-bottom: var(--spacing-2);
            margin-bottom: var(--spacing-2);
            border-bottom: 1px solid color-mix(in srgb, var(--border-color) 55%, transparent);
        }

        #opportunity-detail-container .opp-context-rail .widget-title {
            font-size: var(--font-size-xs);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.32px;
        }

        #opportunity-detail-container .opp-context-rail .action-btn.primary {
            background: var(--primary-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 10px;
            font-size: var(--font-size-xs);
            box-shadow: none;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        #opportunity-detail-container .opp-context-rail .action-btn.primary:hover {
            background: var(--secondary-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        #opportunity-detail-container .opp-context-rail .widget-content {
            padding: 0;
        }

        @media (max-width: 1800px) {
            #opportunity-detail-container #opportunity-stage-stepper .stage-stepper-container {
                --pipeline-step-min: 122px;
                --pipeline-step-pad-start: 9px;
                --pipeline-step-pad-end: 16px;
            }
        }

        @media (max-width: 1024px) {
            .opp-layout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div id="opportunity-detail-container">

        <div class="opp-workspace-shell">
            <div class="opp-workspace-header">
                <div class="opp-layout-grid">
                    <div class="opp-main-info">
        <div id="opportunity-info-card-container" class="opportunity-info-card">
        <div id="opportunity-stage-stepper-container" class="dashboard-widget">
            <div class="widget-header" style="margin-bottom: 0;">
                <h2 class="widget-title">機會進程</h2>
            </div>
            <div id="opportunity-stage-stepper" class="widget-content">
                </div>
        </div>
            </div>
        <div id="tab-content-interactions" class="tab-content active">
            <div class="interaction-layout">
                
                <div class="interaction-history-section">
        
                    <div class="sub-tabs">
                        <button class="sub-tab-link active" data-tab="discussion">動態牆</button>
                        <button class="sub-tab-link" data-tab="activity">系統活動紀錄</button>
                    </div>
                
                    <div id="discussion-pane" class="sub-tab-content active">
                        <div id="discussion-timeline" class="interaction-timeline">
                            </div>
                    </div>
                    <div id="activity-pane" class="sub-tab-content">
                        <div id="activity-log-timeline" class="interaction-timeline">
                            </div>
                    </div>
                
                </div>
            </div>

            <div id="interaction-form-modal" class="interaction-form-modal" hidden>
                    <div class="interaction-form-modal__shell">
                        <div class="interaction-form-modal__content interaction-form-section">
                            <button type="button" class="modal-close-btn" id="interaction-form-modal-close" aria-label="Close">&times;</button>
                    <h3 style="margin-bottom: 1.5rem;">新增/編輯互動</h3>
                    <form id="new-interaction-form">
                        <input type="hidden" id="interaction-opportunity-id">
                        <input type="hidden" id="interaction-edit-rowIndex">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">互動類型</label>
                                <div class="select-wrapper">
                                    <select class="form-select" id="interaction-event-type" required></select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">互動時間</label>
                                <input type="datetime-local" class="form-input" id="interaction-time" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">內容摘要 *</label>
                            <textarea class="form-textarea" id="interaction-summary" placeholder="記錄互動重點..." required></textarea>
                        </div>
                         <div class="form-group">
                            <label class="form-label">下次行動</label>
                            <input type="text" class="form-input" id="interaction-next-action" placeholder="準備報價單並於下週三前寄出..."></input>
                        </div>
                        <button type="submit" class="submit-btn" id="interaction-submit-btn">💾 新增紀錄</button>
                    </form>
                        </div>
                    </div>
                </div>
        </div>


        </div>

            <div class="opp-context-rail">
        <div class="dashboard-widget">
            <div class="widget-header">
                <h2 class="widget-title">關聯聯絡人</h2>
                <button class="action-btn primary" id="add-associated-contact-btn">+ 關聯聯絡人</button>
            </div>
            <div id="associated-contacts-list" class="widget-content">
                </div>
        </div>

        <div class="dashboard-widget">
            <div class="widget-header">
                <h2 class="widget-title">商務脈絡</h2>
                <button class="action-btn primary" id="add-associated-opportunity-btn" style="display: none;" aria-hidden="true" type="button">+ 關聯機會</button>
            </div>
            <div id="associated-opportunities-list" class="widget-content">
                </div>
        </div>

        <div class="dashboard-widget">
            <div class="widget-header">
                <h2 class="widget-title">同公司潛在聯絡人</h2>
            </div>
            <div id="opp-potential-contacts-container" class="widget-content">
                </div>
        </div>
        <div id="opp-event-reports-index" class="dashboard-widget">
            </div>
        <div class="dashboard-widget">
            <div class="widget-header">
                <h2 class="widget-title">快速操作</h2>
            </div>
            <div class="widget-content opp-quick-actions">
                <button type="button" class="action-btn primary" onclick="OpportunityInteractions.showCreateForm()">新增互動</button>
